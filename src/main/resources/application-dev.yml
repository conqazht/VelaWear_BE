spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commercial}
    username: ${DB_USERNAME:commercial}
    password: ${DB_PASSWORD:commercial}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
