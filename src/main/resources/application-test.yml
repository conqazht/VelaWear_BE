spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev

jwt:
  access-token-expiration: 900
  refresh-token-expiration: 259200

app:
  security:
    hmac-secret: test-security-hmac-secret-for-integration-tests-32-bytes-minimum
    rate-limit:
      enabled: false
  english-content:
    gemini:
      enabled: false
  upload:
    base-dir: target/test-uploads
    url-prefix: /uploads
    max-size-bytes: 5242880
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
    allowed-folders:
      - avatars
      - products

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
