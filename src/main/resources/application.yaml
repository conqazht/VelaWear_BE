spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: VelaWear
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start-and-stop
  flyway:
    locations: classpath:db/migration
    encoding: UTF-8
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 10
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - email
              - profile

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:15000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:15000}

server:
  port: ${SERVER_PORT}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
  tomcat:
    remoteip:
      internal-proxies: "${TRUSTED_PROXY_REGEX:(?!)}"
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

jwt:
  access-token-secret-key: ${JWT_ACCESS_TOKEN_SECRET_KEY}
  refresh-token-secret-key: ${JWT_REFRESH_TOKEN_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

payment:
  environment: ${PAYMENT_ENVIRONMENT:sandbox}
  simulation:
    enabled: ${PAYMENT_SIMULATION_ENABLED:true}
  vnpay:
    enabled: ${VNPAY_ENABLED:true}
    tmn-code: ${VNPAY_TMN_CODE:VNPAY_TMN_CODE_PLACEHOLDER}
    hash-secret: ${VNPAY_HASH_SECRET:VNPAY_HASH_SECRET_PLACEHOLDER}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay/return}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  momo:
    enabled: ${MOMO_ENABLED:true}
    partner-code: ${MOMO_PARTNER_CODE:MOMO_PARTNER_CODE_PLACEHOLDER}
    access-key: ${MOMO_ACCESS_KEY:MOMO_ACCESS_KEY_PLACEHOLDER}
    secret-key: ${MOMO_SECRET_KEY:MOMO_SECRET_KEY_PLACEHOLDER}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    return-url: ${MOMO_RETURN_URL:http://localhost:3000/payment/momo/return}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/ipn}
  stripe:
    enabled: ${STRIPE_ENABLED:true}
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/payment/stripe/success?session_id={CHECKOUT_SESSION_ID}&order_code={ORDER_CODE}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/payment/stripe/cancel?order_code={ORDER_CODE}}
    currency: ${STRIPE_CURRENCY:vnd}
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    environment: ${SEPAY_ENVIRONMENT:production}
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    checkout-url: ${SEPAY_CHECKOUT_URL:https://pay.sepay.vn/v1/checkout/init}
    success-url: ${SEPAY_SUCCESS_URL:}
    error-url: ${SEPAY_ERROR_URL:}
    cancel-url: ${SEPAY_CANCEL_URL:}

app:
  checkout:
    shipping-fee: ${APP_CHECKOUT_SHIPPING_FEE:0}
  mail:
    from-email: ${MAIL_FROM_EMAIL:${spring.mail.username:conganhtruongw@gmail.com}}
    from-name: ${MAIL_FROM_NAME:Vela Wear}
  email:
    storefront-base-url: ${STOREFRONT_BASE_URL:http://localhost:3000}
    outbox:
      enabled: ${EMAIL_OUTBOX_ENABLED:true}
      scan-ms: ${EMAIL_OUTBOX_SCAN_MS:10000}
      batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${EMAIL_OUTBOX_MAX_ATTEMPTS:5}
      lease-duration: ${EMAIL_OUTBOX_LEASE_DURATION:2m}
      retry-base-delay: ${EMAIL_OUTBOX_RETRY_BASE_DELAY:1m}
      retry-max-delay: ${EMAIL_OUTBOX_RETRY_MAX_DELAY:1h}
  security:
    hmac-secret: ${SECURITY_HMAC_SECRET:development-only-security-hmac-secret-change-before-production}
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      otp:
        request-cooldown: ${OTP_REQUEST_COOLDOWN:60s}
        max-attempts: ${OTP_MAX_ATTEMPTS:5}
        attempts-lock: ${OTP_ATTEMPTS_LOCK:10m}
      policies:
        otp-request:
          dimensions:
            ip:
              - { limit: 20, window: 10m }
              - { limit: 100, window: 24h }
            global:
              - { limit: 300, window: 1m }
            recipient-purpose:
              - { limit: 1, window: "${OTP_REQUEST_COOLDOWN:60s}" }
              - { limit: 5, window: 15m }
              - { limit: 10, window: 24h }
            recipient:
              - { limit: 15, window: 24h }
            ip-recipient:
              - { limit: 3, window: 15m }
            user:
              - { limit: 5, window: 1h }
        otp-verify:
          dimensions:
            ip:
              - { limit: 30, window: 10m }
              - { limit: 100, window: 1h }
            global:
              - { limit: 600, window: 1m }
        login:
          dimensions:
            ip:
              - { limit: 30, window: 5m }
              - { limit: 100, window: 1h }
            global:
              - { limit: 600, window: 1m }
            account:
              - { limit: 10, window: 15m }
            ip-account:
              - { limit: 5, window: 15m }
        register-reset:
          dimensions:
            ip:
              - { limit: 20, window: 1h }
            global:
              - { limit: 300, window: 1m }
        sensitive-change:
          dimensions:
            ip:
              - { limit: 30, window: 1h }
            global:
              - { limit: 300, window: 1m }
            user:
              - { limit: 5, window: 1h }
        refresh:
          dimensions:
            ip:
              - { limit: 120, window: 1m }
            global:
              - { limit: 1000, window: 1m }
            session:
              - { limit: 30, window: 1m }
        oauth-exchange:
          dimensions:
            ip:
              - { limit: 30, window: 10m }
            global:
              - { limit: 300, window: 1m }
        auth-session:
          dimensions:
            ip:
              - { limit: 300, window: 1m }
            global:
              - { limit: 2000, window: 1m }
            user:
              - { limit: 120, window: 1m }
            session:
              - { limit: 120, window: 1m }
        avatar-upload:
          dimensions:
            ip:
              - { limit: 30, window: 1h }
            global:
              - { limit: 300, window: 1m }
            user:
              - { limit: 5, window: 1h }
  english-content:
    gemini:
      enabled: ${ENGLISH_CONTENT_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      default-model: ${GEMINI_DEFAULT_MODEL:gemini-3.1-flash-lite}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${GEMINI_READ_TIMEOUT:30s}
      max-input-characters: ${ENGLISH_CONTENT_MAX_INPUT_CHARACTERS:30000}
      max-output-tokens: ${ENGLISH_CONTENT_MAX_OUTPUT_TOKENS:16384}
  oauth2:
    frontend-success-url: ${OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:3000/auth/oauth2/callback}
    frontend-failure-url: ${OAUTH2_FRONTEND_FAILURE_URL:http://localhost:3000/sign-in}
    login-code-ttl-seconds: ${OAUTH2_LOGIN_CODE_TTL_SECONDS:120}
    authorization-request-ttl-seconds: ${OAUTH2_AUTHORIZATION_REQUEST_TTL_SECONDS:180}
  otp:
    ttl-seconds: 300
    proof-ttl-seconds: 300
  upload:
    base-dir: ./uploads
    url-prefix: /uploads
    max-size-bytes: 5242880
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
    allowed-folders:
      - avatars
      - products
    avatar:
      reconciliation-cron: ${AVATAR_RECONCILIATION_CRON:0 0 */6 * * *}
      orphan-grace: ${AVATAR_ORPHAN_GRACE:24h}
  user:
    retention-days: ${USER_RETENTION_DAYS:45}
    cleanup-cron: ${USER_CLEANUP_CRON:0 0 3 * * *}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
