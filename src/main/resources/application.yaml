spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: VelaWear
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start-and-stop
  flyway:
    locations: classpath:db/migration
    encoding: UTF-8
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 10
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - email
              - profile

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  access-token-secret-key: ${JWT_ACCESS_TOKEN_SECRET_KEY}
  refresh-token-secret-key: ${JWT_REFRESH_TOKEN_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

payment:
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    environment: ${SEPAY_ENVIRONMENT:production}
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    checkout-url: ${SEPAY_CHECKOUT_URL:https://pay.sepay.vn/v1/checkout/init}
    success-url: ${SEPAY_SUCCESS_URL:}
    error-url: ${SEPAY_ERROR_URL:}
    cancel-url: ${SEPAY_CANCEL_URL:}

app:
  oauth2:
    frontend-success-url: ${OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:3000/auth/oauth2/callback}
    frontend-failure-url: ${OAUTH2_FRONTEND_FAILURE_URL:http://localhost:3000/sign-in}
    login-code-ttl-seconds: ${OAUTH2_LOGIN_CODE_TTL_SECONDS:120}
  otp:
    ttl-seconds: 300
    cooldown-seconds: 60
    max-attempts: 5
    verified-ttl-seconds: 300
  upload:
    base-dir: ./uploads
    url-prefix: /uploads
    max-size-bytes: 5242880
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
    allowed-folders:
      - avatars
      - products
      - reviews

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
