spring:
  application:
    name: VelaWear
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    apiversion:
      enabled: true
      supported: 1
      default: 1
      use:
        path-segment: 1
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret-key: ${JWT_SECRET_KEY:change-this-development-secret-key-must-be-at-least-64-characters-long}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
