spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}

jwt:
  access-token-secret-key: ${JWT_ACCESS_TOKEN_SECRET_KEY}
  refresh-token-secret-key: ${JWT_REFRESH_TOKEN_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:259200}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
  structured:
    format:
      console: logstash

app:
  security:
    hmac-secret: ${SECURITY_HMAC_SECRET}
