services:
  postgres:
    image: postgres:16-alpine
    container_name: commercial-postgres
    environment:
      POSTGRES_DB: commercial
      POSTGRES_USER: commercial
      POSTGRES_PASSWORD: commercial
    ports:
      - "5432:5432"
    volumes:
      - commercial_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercial -d commercial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  commercial_postgres_data:
