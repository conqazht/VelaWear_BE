name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_PORT: "0"

      JWT_ACCESS_TOKEN_SECRET_KEY: test-access-secret-key-for-ci-must-be-at-least-64-characters-long
      JWT_REFRESH_TOKEN_SECRET_KEY: test-refresh-secret-key-for-ci-must-be-at-least-64-characters-long
      JWT_ACCESS_TOKEN_EXPIRATION: "900"
      JWT_REFRESH_TOKEN_EXPIRATION: "259200"

      RESEND_API_KEY: test-resend-api-key
      SEPAY_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
